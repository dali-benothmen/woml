name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_BUILD_JOBS: '1'

jobs:
  architecture-separation:
    name: WOML architecture separation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile

      - name: Build and verify the WOML-only boundary
        working-directory: woml-cli
        run: bun run test:architecture-separation

  frontend:
    name: WOML frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile

      - name: Test the WOML language frontend
        working-directory: woml-cli
        run: bun test ../woml/tests

      - name: Type-check the WOML CLI
        working-directory: woml-cli
        run: bun run typecheck
