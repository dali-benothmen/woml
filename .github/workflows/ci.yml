name: WOML CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: woml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'
  CARGO_BUILD_JOBS: '1'
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Language frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Test parsing, validation, and compilation
        working-directory: woml-cli
        run: bun test ../woml/tests --max-concurrency=1
      - name: Type-check frontend and CLI
        working-directory: woml-cli
        run: bun run typecheck
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          git status --short

  cli:
    name: CLI and runtime journeys
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Build the local runtime once
        working-directory: woml-cli
        run: bun run build
      - name: Enforce deterministic performance contracts
        working-directory: woml-cli
        run: bun run test:performance-regression
      - name: Test portable CLI contracts
        working-directory: woml-cli
        run: bun run test:cli:contracts
      - name: Test communication providers
        working-directory: woml-cli
        run: bun run test:cli:providers
      - name: Test runtime operations
        working-directory: woml-cli
        run: bun run test:cli:operations
      - name: Test the secure process CLI journey
        working-directory: woml-cli
        run: bun test tests/process-cli.test.ts --max-concurrency=1
      - name: Test the durable artifact operator journey
        working-directory: woml-cli
        run: bun test tests/durable-artifacts-cli.test.ts --max-concurrency=1
      - name: Enforce Durable Artifacts performance and publication contracts
        working-directory: woml-cli
        run: >-
          bun run benchmark:durable-artifacts &&
          bun scripts/verify-durable-artifacts-release.ts
      - name: Enforce Durable Waits publication contracts
        working-directory: woml-cli
        run: >-
          bun run benchmark:durable-waits &&
          bun scripts/verify-durable-waits-release.ts
      - name: Enforce Locks and Leases publication contracts
        working-directory: woml-cli
        run: >-
          bun run benchmark:locks-and-leases &&
          bun scripts/verify-locks-and-leases-release.ts
      - name: Enforce Compensation and Cleanup publication contracts
        working-directory: woml-cli
        run: >-
          bun run benchmark:compensation-and-cleanup &&
          bun test tests/compensation-and-cleanup-packaged-release.test.ts --max-concurrency=1 &&
          bun scripts/verify-compensation-and-cleanup-release.ts
      - name: Enforce Rich Plan Approvals publication contracts
        working-directory: woml-cli
        run: >-
          bun run benchmark:rich-plan-approvals &&
          bun scripts/verify-rich-plan-approvals-release.ts
      - name: Enforce Infrastructure Policies performance and publication contracts
        working-directory: woml-cli
        run: >-
          bun run benchmark:infrastructure-policy &&
          bun scripts/verify-infrastructure-policy-release.ts
      - name: Enforce Streaming Output and Progress publication contracts
        working-directory: woml-cli
        run: >-
          bun run benchmark:streaming-output &&
          bun scripts/verify-streaming-output-release.ts
      - name: Test for-each presentation and clean package
        working-directory: woml-cli
        run: >-
          bun test tests/for-each-presentation-hardening.test.ts
          tests/for-each-packaged-release.test.ts --max-concurrency=1
      - name: Record informational end-to-end performance
        working-directory: woml-cli
        run: bun run report:performance-regression
      - name: Upload informational performance report
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: ci-woml-performance-${{ github.run_attempt }}
          path: woml-cli/.woml/performance/regression-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          cargo --version
          git status --short
          find .woml woml-cli/.woml -maxdepth 3 -type f -print 2>/dev/null || true

  rust:
    name: Rust engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Build JavaScript hosts used by Rust integration tests
        working-directory: woml-cli
        run: bun run build:js
      - name: Check formatting
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Lint the engine
        working-directory: woml-cli
        run: bun run test:communication-provider-clippy
      - name: Test engine units serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --lib -- --test-threads=1
      - name: Test durable engine baseline serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine
          --test dag_engine
          --test durable_event_store
          --test script_host_protocol
          --test trigger_occurrence
          --test retry_runtime
          --test runtime_policy_store
          --test for_each_model
          --test for_each_runtime
          --test for_each_recovery
          --test backup_restore
          --test durable_wait_runtime
          --test locks_and_leases
          --test compensation_runtime
          --test compensation_store
          --test rich_plan_approval_model
          --test rich_plan_approval_authority
          --test rich_plan_approval_runtime
          --test remote_execution_targets_model
          --test infrastructure_policy_contract
          --test infrastructure_policy_authority
          --test operational_output_store
          --test retention
          --test webhook_runtime
          -- --test-threads=1
      - name: Failure diagnostics
        if: failure()
        run: |
          rustc --version
          cargo --version
          git status --short

  process-containment:
    name: Process containment (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Process v1 containment serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --lib process::tests -- --test-threads=1
      - name: Failure diagnostics
        if: failure()
        run: |
          rustc --version
          cargo --version
          git status --short

  artifact-filesystem:
    name: Artifact filesystem (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Durable Artifacts paths, streaming, cancellation, recovery, and operator boundaries
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --lib artifacts::tests -- --test-threads=1
      - name: Test Durable Waits persistence and concurrency boundaries
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --test durable_wait_runtime -- --test-threads=1
      - name: Failure diagnostics
        if: failure()
        run: |
          rustc --version
          cargo --version
          git status --short

  compensation-correction:
    name: Compensation and cleanup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Build JavaScript hosts used by correction tests
        working-directory: woml-cli
        run: bun run build:js
      - name: Test correction, cancellation, recovery, and storage serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --test compensation_runtime --test compensation_store
          -- --test-threads=1
      - name: Failure diagnostics
        if: failure()
        run: |
          rustc --version
          cargo --version
          git status --short

  rich-plan-approvals:
    name: Rich Plan Approvals (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Build JavaScript hosts used by approval tests
        working-directory: woml-cli
        run: bun run build:js
      - name: Test authority, recovery, input, and provider boundaries serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --test rich_plan_approval_model
          --test rich_plan_approval_authority --test rich_plan_approval_runtime
          -- --test-threads=1
      - name: Test HTTP and Provider Host v3 adversarial inputs
        working-directory: woml-cli
        run: >-
          bun test tests/approval-server.test.ts
          tests/rich-approval-presentation.test.ts --max-concurrency=1
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          rustc --version
          cargo --version
          git status --short

  infrastructure-policies:
    name: Infrastructure Policies (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Test policy parsing, generated inputs, evaluation, evidence, recovery, and authority
        working-directory: woml-cli
        run: bun run test:infrastructure-policy-hardening
      - name: Enforce policy publication budgets and bypass inventory
        working-directory: woml-cli
        run: >-
          bun run benchmark:infrastructure-policy &&
          bun scripts/verify-infrastructure-policy-release.ts
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          rustc --version
          cargo --version
          git status --short

  remote-execution-targets:
    name: Remote Execution Targets (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Test authoring, registry, trust, policy, CLI, and lazy activation
        working-directory: woml-cli
        run: >-
          bun run test:remote-execution-targets-authoring &&
          bun run test:remote-execution-targets-registry
      - name: Test Rust Model v21 contract serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --test remote_execution_targets_model --
          --test-threads=1
      - name: Test authenticated worker protocol, attempt runtime, journal, and dispatch authority
        working-directory: woml-cli
        run: >-
          bun run test:remote-execution-targets-protocol &&
          bun run test:remote-execution-targets-dispatch
      - name: Test the packaged native remote attempt and terminal replay
        working-directory: woml-cli
        run: bun run test:remote-execution-targets-package
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          rustc --version
          cargo --version
          git status --short

  combined-developer-experience:
    name: Combined Developer Experience (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Build the local native and portable release candidates
        working-directory: woml-cli
        run: bun run build && bun run build:release
      - name: Verify the combined contract and frozen budgets
        working-directory: woml-cli
        run: >-
          bun run test:combined-developer-experience-contracts &&
          bun scripts/benchmark-combined-developer-experience.ts &&
          bun scripts/verify-combined-developer-experience-release.ts
      - name: Test the clean installed project, artifacts, telemetry, coordinator, and worker serially
        working-directory: woml-cli
        run: bun run test:combined-developer-experience-package
      - name: Verify docs, links, and examples with the built CLI
        working-directory: woml-cli
        run: bun run test:documentation
      - name: Verify native exports and TypeScript
        working-directory: woml-cli
        run: bun run verify:native-exports && bun run typecheck
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          rustc --version
          cargo --version
          git status --short

  operational-output:
    name: Operational Output Store (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test output ordering, redaction, retention, recovery, and governed rollover serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --test operational_output_store --
          --test-threads=1
          --skip publication_budgets_cover_activation_append_replay_progress_concurrency_and_prune &&
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --lib
          process::tests::incremental_stream_redaction_covers_every_secret_split_and_invalid_utf8
          -- --exact --test-threads=1 &&
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --lib operational_output_rollover -- --test-threads=1
      - name: Failure diagnostics
        if: failure()
        run: |
          rustc --version
          cargo --version
          git status --short

  opentelemetry:
    name: OpenTelemetry Export (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Test local OTLP export, failure isolation, privacy, and budgets
        working-directory: woml-cli
        run: bun run test:opentelemetry
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          git status --short

  lock-authority:
    name: Lock authority (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked runtime dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Test lock races, limits, recovery, restore, and retention serially
        working-directory: core
        run: >-
          cargo test --config profile.dev.debug=0
          --config profile.dev.incremental=false -j 1 --locked
          -p woml-engine --test locks_and_leases --test backup_restore
          --test retention -- --test-threads=1
      - name: Failure diagnostics
        if: failure()
        run: |
          rustc --version
          cargo --version
          git status --short

  architecture:
    name: Architecture separation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Verify the WOML-only boundary
        working-directory: woml-cli
        run: bun run test:architecture-separation
      - name: Failure diagnostics
        if: failure()
        run: git status --short

  documentation:
    name: Documentation and examples
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install locked dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Verify docs, links, examples, and clean quick start
        working-directory: woml-cli
        run: bun run test:documentation
      - name: Failure diagnostics
        if: failure()
        run: git status --short

  package:
    name: Package contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Build the portable release package
        working-directory: woml-cli
        run: bun run build:native && bun run build:release
      - name: Verify release identity and package contracts
        working-directory: woml-cli
        run: >-
          bun test tests/release-identity.test.ts
          tests/native-platform-release.test.ts
          tests/release-package.test.ts
          tests/release-artifact.test.ts
          tests/release-family.test.ts
          tests/release-automation.test.ts
          --max-concurrency=1
      - name: Test Durable Artifacts from the clean release package
        working-directory: woml-cli
        run: bun test tests/durable-artifacts-packaged-release.test.ts --max-concurrency=1
      - name: Test Durable Waits from the clean release package
        working-directory: woml-cli
        run: bun test tests/durable-waits-packaged-release.test.ts --max-concurrency=1
      - name: Test Locks and Leases from the clean release package
        working-directory: woml-cli
        run: bun test tests/locks-and-leases-packaged-release.test.ts --max-concurrency=1
      - name: Test Rich Plan Approvals from the clean release package
        working-directory: woml-cli
        run: bun test tests/rich-plan-approvals-packaged-release.test.ts --max-concurrency=1
      - name: Test Infrastructure Policies from the clean release package
        working-directory: woml-cli
        run: bun test tests/infrastructure-policy-packaged-release.test.ts --max-concurrency=1
      - name: Test Streaming Output and Progress from the clean release package
        working-directory: woml-cli
        run: bun test tests/streaming-output-packaged-release.test.ts --max-concurrency=1
      - name: Test OpenTelemetry Export from the clean release package
        working-directory: woml-cli
        run: bun test tests/opentelemetry-packaged-release.test.ts --max-concurrency=1
      - name: Test the Combined Developer Experience from the clean release package
        working-directory: woml-cli
        run: bun test tests/combined-developer-experience-packaged-release.test.ts --max-concurrency=1
      - name: Pack, seal, and reverify the main artifact
        run: |
          bun woml-cli/scripts/release-artifact.ts pack --root release/main
          bun woml-cli/scripts/release-artifact.ts seal --root release/main --kind main
          bun woml-cli/scripts/release-artifact.ts verify --root release/main
      - uses: actions/upload-artifact@v6
        with:
          name: ci-woml-main
          path: release/main
          if-no-files-found: error
          retention-days: 7
      - name: Failure diagnostics
        if: failure()
        run: |
          node --version
          npm --version
          find release -maxdepth 4 -type f -print 2>/dev/null || true
          git status --short
