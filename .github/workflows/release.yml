name: WOML Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish the verified package family to npm
        required: true
        type: boolean
        default: false

concurrency:
  group: woml-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: '1.3.14'
  CARGO_BUILD_JOBS: '1'
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release contracts
    runs-on: ubuntu-24.04
    outputs:
      release-tag: ${{ steps.contract.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install locked dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Freeze the source ref and release identity
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./woml-cli/package.json').version")
          expected="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            bun woml-cli/scripts/native-release.ts verify-tag --tag "${GITHUB_REF_NAME}"
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${expected}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.publish_to_npm }}" == "true" && "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo 'Publishing requires manually running this workflow from the exact release tag.' >&2
            exit 1
          fi
          echo "release-tag=${release_tag}" >> "${GITHUB_OUTPUT}"
      - name: Verify release source contracts
        working-directory: woml-cli
        run: |
          bun test tests/release-identity.test.ts tests/native-platform-release.test.ts --max-concurrency=1
          bun run test:release-automation
          bun run test:for-each-contracts
      - name: Run the final source and dependency security review
        run: |
          bun run test:final-review
          bun audit --cwd woml-cli
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file core/Cargo.lock --ignore RUSTSEC-2026-0258
      - name: Failure diagnostics
        if: failure()
        run: |
          bun --version
          node --version
          npm --version
          git status --short

  build-main:
    name: Build portable woml package
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        working-directory: woml-cli
        run: bun install --frozen-lockfile
      - name: Install compiler dependencies
        working-directory: woml
        run: bun install --frozen-lockfile
      - name: Build the platform-neutral package
        working-directory: woml-cli
        run: bun run build:release
      - name: Pack, seal, and verify the main artifact
        run: |
          bun woml-cli/scripts/release-artifact.ts pack --root release/main
          bun woml-cli/scripts/release-artifact.ts seal --root release/main --kind main
          bun woml-cli/scripts/release-artifact.ts verify --root release/main
      - uses: actions/upload-artifact@v6
        with:
          name: woml-main
          path: release/main
          if-no-files-found: error
          retention-days: 14
      - name: Failure diagnostics
        if: failure()
        run: |
          find release -maxdepth 4 -type f -print 2>/dev/null || true
          git status --short

  build-native:
    name: Build and load-test ${{ matrix.package }}
    needs: [validate, build-main]
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: darwin-x64
            runner: macos-15-intel
            rust: x86_64-apple-darwin
            library: libwoml_core.dylib
          - package: darwin-arm64
            runner: macos-15
            rust: aarch64-apple-darwin
            library: libwoml_core.dylib
          - package: win32-x64-msvc
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
            library: woml_core.dll
          - package: win32-arm64-msvc
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
            library: woml_core.dll
          - package: linux-x64-gnu
            runner: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
            library: libwoml_core.so
            linuxContainer: rust:1.88-bullseye
            glibcMax: '2.31'
          - package: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
            library: libwoml_core.so
            linuxContainer: rust:1.88-bullseye
            glibcMax: '2.31'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: woml-main
          path: release/main
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Build the isolated WOML native adapter
        if: ${{ !startsWith(matrix.package, 'linux-') }}
        shell: bash
        run: >-
          cargo build -j 1 --release --locked
          --manifest-path core/woml-native/Cargo.toml
          --target ${{ matrix.rust }}
      - name: Build the Linux adapter against the compatibility baseline
        if: ${{ startsWith(matrix.package, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --env CARGO_BUILD_JOBS=1 \
            --env CARGO_TERM_COLOR=always \
            "${{ matrix.linuxContainer }}" \
            cargo build -j 1 --release --locked \
              --manifest-path core/woml-native/Cargo.toml \
              --target "${{ matrix.rust }}"
      - name: Enforce the Linux glibc compatibility ceiling
        if: ${{ startsWith(matrix.package, 'linux-') }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="dist/target/${{ matrix.rust }}/release/${{ matrix.library }}"
          highest=$(readelf --version-info "${artifact}" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
            | sort -Vu \
            | tail -n 1)
          ceiling="GLIBC_${{ matrix.glibcMax }}"
          if [[ -z "${highest}" ]]; then
            echo "Unable to determine the glibc requirement for ${artifact}." >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "${ceiling}" "${highest}" | sort -V | tail -n 1)" != "${ceiling}" ]]; then
            echo "${artifact} requires ${highest}, above the supported ${ceiling} ceiling." >&2
            exit 1
          fi
          echo "${artifact} requires at most ${highest}; supported ceiling is ${ceiling}."
      - name: Create the target-specific npm package
        shell: bash
        run: >-
          bun woml-cli/scripts/native-release.ts package-platform
          --target ${{ matrix.package }}
          --artifact dist/target/${{ matrix.rust }}/release/${{ matrix.library }}
          --output release/native
      - name: Load-test the native exports on the matching runtime
        shell: bash
        run: >-
          bun woml-cli/scripts/release-artifact.ts load-native
          --root release/native
          --target ${{ matrix.package }}
      - name: Pack, seal, and verify the native artifact
        shell: bash
        run: |
          bun woml-cli/scripts/release-artifact.ts pack --root release/native
          bun woml-cli/scripts/release-artifact.ts seal --root release/native --kind native --target ${{ matrix.package }}
          bun woml-cli/scripts/release-artifact.ts verify --root release/native
      - name: Clean-install and execute the release candidate
        shell: bash
        run: >-
          bun woml-cli/scripts/smoke-release-candidate.ts
          --main-root release/main
          --native-root release/native
          --target ${{ matrix.package }}
      - uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.package }}
          path: release/native
          if-no-files-found: error
          retention-days: 14
      - name: Failure diagnostics
        if: failure()
        shell: bash
        run: |
          bun --version
          rustc --version
          cargo --version
          find release dist/target -maxdepth 5 -type f -print 2>/dev/null || true
          git status --short

  collect:
    name: Verify the complete package family
    runs-on: ubuntu-24.04
    needs: [validate, build-main, build-native]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@v6
        with:
          name: woml-main
          path: release/collected/main
      - uses: actions/download-artifact@v6
        with:
          pattern: native-*
          path: release/collected/platforms
          merge-multiple: false
      - name: Verify versions, platforms, licenses, checksums, and exports
        run: >-
          bun woml-cli/scripts/native-release.ts verify-collected
          --main release/collected/main
          --platforms release/collected/platforms
          --tag "${{ needs.validate.outputs.release-tag }}"
      - uses: actions/upload-artifact@v6
        with:
          name: woml-release-family
          path: release/collected
          if-no-files-found: error
          retention-days: 30
      - name: Failure diagnostics
        if: failure()
        run: find release/collected -maxdepth 5 -type f -print 2>/dev/null || true

  publish:
    name: Publish npm release
    if: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_npm == true)) }}
    runs-on: ubuntu-24.04
    needs: [validate, collect]
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: woml-release-family
          path: release/collected
      - name: Reverify the immutable release family
        run: >-
          bun woml-cli/scripts/native-release.ts verify-collected
          --main release/collected/main
          --platforms release/collected/platforms
          --tag "${GITHUB_REF_NAME}"
      - name: Verify npm publishing client
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          node -e "const { execFileSync } = require('node:child_process'); const [major, minor] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) process.exit(1)"
      - name: Verify npm publication credential
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo 'NPM_TOKEN is missing. Add it as a GitHub Actions repository or npm-production environment secret.' >&2
            exit 1
          fi
      - name: Publish native platform packages first
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for directory in release/collected/platforms/native-*; do
            archive=$(find "${directory}" -maxdepth 1 -name '*.tgz' -type f -print -quit)
            name=$(node -p "require('./${directory}/package.json').name")
            version=$(node -p "require('./${directory}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}; it is already published."
            else
              npm publish "${archive}" --access public --provenance
            fi
          done
      - name: Publish woml last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./release/collected/main/package.json').version")
          archive=$(find release/collected/main -maxdepth 1 -name '*.tgz' -type f -print -quit)
          if npm view "woml-cli@${version}" version >/dev/null 2>&1; then
            echo "Skipping woml-cli@${version}; it is already published."
          else
            npm publish "${archive}" --access public --provenance
          fi
      - name: Package the WOML Skill
        shell: bash
        run: tar -czf woml-skill.tar.gz -C skills/woml .
      - name: Create the GitHub release after npm succeeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" woml-skill.tar.gz --clobber
      - name: Failure diagnostics
        if: failure()
        run: |
          node --version
          npm --version
          find release/collected -maxdepth 5 -type f -print 2>/dev/null || true
