[package]
name = "woml-native"
version = "1.0.5"
edition = "2021"
description = "WOML-only N-API adapter for the Rust workflow engine"
license = "Apache-2.0"
repository = "https://github.com/dali-benothmen/woml"

[lib]
name = "woml_core"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2.0"

[dependencies]
actix-web = "4.11"
chrono = { version = "0.4", features = ["serde"] }
napi = { version = "2.15", default-features = false, features = ["napi4", "tokio_rt"] }
napi-derive = "3.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
woml-engine = { version = "1.0.5", path = "../woml-engine" }
