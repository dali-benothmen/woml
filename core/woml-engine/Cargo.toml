[package]
name = "woml-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "woml_engine"

[dependencies]
actix-web = "4.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
jsonschema = { version = "0.49.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# jsonschema 0.49 requires CompactFormatter::default(), available from 1.0.143.
serde_json = { version = "1.0.143", features = ["preserve_order"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
subtle = "2.6"
rusqlite = { version = "0.30", features = ["bundled"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.0", features = ["v4"] }
