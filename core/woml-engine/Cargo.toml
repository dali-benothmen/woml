[package]
name = "woml-engine"
version = "1.0.10"
edition = "2021"
description = "Durable event-sourced workflow execution engine for WOML"
license = "Apache-2.0"
repository = "https://github.com/dali-benothmen/woml"

[lib]
name = "woml_engine"

[dependencies]
actix-web = "4.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
futures-util = "0.3"
fs2 = "0.4"
base64 = "0.22"
bytes = "1.0"
getrandom = "0.2"
hex = "0.4"
jsonschema = { version = "0.49.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# jsonschema 0.49 requires CompactFormatter::default(), available from 1.0.143.
serde_json = { version = "1.0.143", features = ["preserve_order"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
hmac = "0.12"
libc = "0.2"
serde_urlencoded = "0.7"
subtle = "2.6"
rusqlite = { version = "0.30", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
thiserror = "1.0"
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }
uuid = { version = "1.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
