[package]
name = "woml-engine"
version = "1.0.1"
edition = "2021"
description = "Durable event-sourced workflow execution engine for WOML"
license = "Apache-2.0"
repository = "https://github.com/dali-benothmen/woml"

[lib]
name = "woml_engine"

[dependencies]
actix-web = "4.11"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
futures-util = "0.3"
fs2 = "0.4"
base64 = "0.22"
bytes = "1.0"
getrandom = "0.2"
hex = "0.4"
jsonschema = { version = "0.49.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
# jsonschema 0.49 requires CompactFormatter::default(), available from 1.0.143.
serde_json = { version = "1.0.143", features = ["preserve_order"] }
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
hmac = "0.12"
serde_urlencoded = "0.7"
subtle = "2.6"
rusqlite = { version = "0.30", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
thiserror = "1.0"
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }
uuid = { version = "1.0", features = ["v4"] }
